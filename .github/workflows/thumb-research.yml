name: thumb-research
# One-off research run: thumbnails of well-performing Japan-culture explainers.
on:
  push:
    branches: [claude/project-thread-l8sw8w]
    paths: ["tools/thumb-research/**", ".github/workflows/thumb-research.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow
      - run: python3 tools/thumb-research/fetch.py research-out
      - name: Save
        run: |
          git config user.name "thumb-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research-out
          git commit -qm "thumb research results" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
